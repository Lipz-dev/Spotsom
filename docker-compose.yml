services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - spotsom-data:/app/data
      - spotsom-audio:/app/wwwroot/audio
    environment:
      ConnectionStrings__Spotsom: "Data Source=/app/data/Spotsom.db"
    restart: unless-stopped

  frontend:
    build:
      context: ./spotsom-front
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  spotsom-data:
  spotsom-audio:
